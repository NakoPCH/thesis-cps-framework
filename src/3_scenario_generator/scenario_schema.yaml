# ==============================================================================
# CPS SCENARIO SPECIFICATION SCHEMA
# ==============================================================================
# Purpose: Declarative, domain-agnostic scenario definition for CPS goal testing.
# Dynamics Model: Piecewise linear continuous signals + discrete event triggers.
# Math rule for continuous segments: value(t) = segment.value + segment.rate * (t - segment.time)
# ==============================================================================

scenario_id: "example_multi_entity_scenario"
category: "operational" # Permitted values: operational, fault, security
description: "Demonstration of multiple entities, multi-axis motion, and standardized discrete events."
duration: 120.0 # Total scenario duration in seconds (must be > 0.0)

# ------------------------------------------------------------------------------
# Continuous Signals: Monitored telemetry, sensors, or metrics drifting over time.
# Multiple signals can target different attributes on the same broker topic,
# or target entirely different physical entities in the world model.
#
# Multi-dimensional coordinates/vectors (e.g. position) must be split into
# separate scalar signals using dot notation in 'attribute:' (e.g., position.x).
#
# Segment rule: Active on [t_i, t_{i+1}). Final segment active on [t_k, duration].
# Rate semantics:
#   rate = 0.0  -> constant steady value
#   rate < 0.0  -> linear decay (e.g., resource drainage, temperature cooling)
#   rate > 0.0  -> linear growth (e.g., speed ramp, forward translation)
# ------------------------------------------------------------------------------
continuous_signals:
  # Entity A - Attribute 1 (Scalar resource metric)
  - topic: "example.robot.telemetry"
    attribute: "battery"
    segments:
      - time: 0.0
        value: 100.0
        rate: -0.2
      - time: 60.0
        value: 88.0
        rate: -1.0

  # Entity A - Attribute 2 (Linear velocity)
  - topic: "example.robot.telemetry"
    attribute: "speed"
    segments:
      - time: 0.0
        value: 0.0
        rate: 0.2
      - time: 20.0
        value: 4.0
        rate: 0.0

  # Entity A - Attribute 3.1 (Multi-axis coordinate: X-axis movement)
  - topic: "example.robot.telemetry"
    attribute: "position.x"
    segments:
      - time: 0.0
        value: 0.0
        rate: 1.5
      - time: 40.0
        value: 60.0
        rate: 0.0

  # Entity A - Attribute 3.2 (Multi-axis coordinate: Y-axis movement)
  - topic: "example.robot.telemetry"
    attribute: "position.y"
    segments:
      - time: 0.0
        value: 0.0
        rate: 0.0
      - time: 40.0
        value: 0.0
        rate: 0.5

  # Entity A - Attribute 4 (Demonstrating an instantaneous step-jump/glitch)
  # Preceding segment actively drifts with rate: -0.2 and implicitly ends at t=50.0.
  # The new segment at t=50.0 immediately assumes the jump value (10.0) without
  # creating a duplicate timestamp, and can continue with any rate (zero or non-zero rates before and/or after instantenous step is okay.).
  - topic: "example.robot.telemetry"
    attribute: "sensor_status"
    segments:
      - time: 0.0
        value: 20.0
        rate: -0.2
      - time: 50.0
        value: 10.0
        rate: 0.5

  # Entity B - Attribute 1 (Environmental sensor)
  - topic: "example.sensor.ambient"
    attribute: "temperature"
    segments:
      - time: 0.0
        value: 22.0
        rate: 0.0
      - time: 75.0
        value: 22.0
        rate: 0.8

# ------------------------------------------------------------------------------
# Discrete Events: Instantaneous state switches, actuator commands, or network injections.
# Standardized format matching continuous signals: specifies target topic, attribute, and assigned value.
# Triggered once at the exact timestamp 'time'. (Optional: use [] if none needed).
# ------------------------------------------------------------------------------
discrete_events:
  - time: 30.0
    topic: "example.actuator.conveyor"
    attribute: "state"
    value: 1
    description: "Actuator state activation"

  - time: 90.0
    topic: "example.actuator.alarm"
    attribute: "active"
    value: true
    description: "Alarm state activation"